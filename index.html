<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samtech Nexus Limited | Design, Online Services, Web & Tech Hub Nairobi</title>
  <style>
    :root {
      --navy-dark: #060f20;
      --navy-main: #0b1933;
      --navy-card: #112344;
      --navy-hover: #162c54;
      --gold: #d4af37;
      --gold-light: #f3d266;
      --text-light: #f8fafc;
      --text-muted: #cbd5e1;
      --whatsapp: #25d366;
      --whatsapp-dark: #1ebe5d;
      --mpesa: #43b02a;
      --paypal: #0070ba;
      --border-subtle: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--navy-dark);
      color: var(--text-light);
      line-height: 1.6;
    }

    /* Navigation Bar */
    header {
      background-color: rgba(6, 15, 32, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 20px;
      backdrop-filter: blur(8px);
    }

    .nav-container {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.6px;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--gold);
    }

    /* Hero Section */
    .hero {
      background: radial-gradient(circle at top center, #162e5c 0%, var(--navy-dark) 75%);
      text-align: center;
      padding: 90px 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .hero-badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.14);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 4.5vw, 3.2rem);
      color: var(--gold);
      margin-bottom: 1rem;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .hero p {
      max-width: 720px;
      margin: 0 auto 2.2rem;
      font-size: 1.15rem;
      color: var(--text-muted);
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-wa {
      background-color: var(--whatsapp);
      color: #042912;
    }

    .btn-wa:hover {
      background-color: var(--whatsapp-dark);
    }

    .btn-outline {
      border: 2px solid var(--gold);
      color: var(--gold);
      background: transparent;
    }

    .btn-outline:hover {
      background: rgba(212, 175, 55, 0.12);
    }

    /* Sections & Containers */
    section {
      padding: 75px 20px;
    }

    .alt-bg {
      background-color: var(--navy-main);
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 48px;
    }

    .section-title h2 {
      font-size: 2.1rem;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .section-title p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Grids & Cards */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 24px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      align-items: start;
    }

    .card {
      background-color: var(--navy-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--gold);
      background-color: var(--navy-hover);
      transform: translateY(-3px);
    }

    .card-num {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .card h3 {
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 18px;
      flex-grow: 1;
    }

    .price-tag {
      display: inline-block;
      background: rgba(212, 175, 55, 0.14);
      color: var(--gold-light);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    .card-btn {
      display: block;
      text-align: center;
      background-color: rgba(37, 211, 102, 0.14);
      border: 1px solid var(--whatsapp);
      color: var(--whatsapp);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 10px 14px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .card-btn:hover {
      background-color: var(--whatsapp);
      color: #042912;
    }

    /* Payment Section Styling */
    .payment-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .badge-mpesa {
      background-color: rgba(67, 176, 42, 0.2);
      color: #7ce863;
      border: 1px solid var(--mpesa);
    }

    .badge-bank {
      background-color: rgba(212, 175, 55, 0.2);
      color: var(--gold-light);
      border: 1px solid var(--gold);
    }

    .badge-paypal {
      background-color: rgba(0, 112, 186, 0.25);
      color: #66b8ff;
      border: 1px solid var(--paypal);
    }

    .pay-detail-box {
      background-color: var(--navy-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .pay-detail-box div {
      margin-bottom: 6px;
    }

    .pay-detail-box div:last-child {
      margin-bottom: 0;
    }

    .pay-detail-box span {
      color: var(--gold-light);
      font-weight: 700;
    }

    .btn-copy {
      width: 100%;
      padding: 10px 14px;
      background-color: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-copy:hover {
      background-color: var(--gold);
      color: var(--navy-dark);
    }

    .btn-paypal {
      display: block;
      text-align: center;
      background-color: var(--paypal);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 11px 14px;
      border-radius: 6px;
      transition: opacity 0.2s ease;
    }

    .btn-paypal:hover {
      opacity: 0.9;
    }

    .payment-confirm-bar {
      margin-top: 32px;
      background-color: var(--navy-card);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* About & Location Box */
    .location-highlight {
      margin-top: 20px;
      padding: 16px;
      background-color: rgba(212, 175, 55, 0.1);
      border-left: 4px solid var(--gold);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-light);
    }

    .benefits-list {
      list-style: none;
    }

    .benefits-list li {
      position: relative;
      padding-left: 26px;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .benefits-list li strong {
      color: #ffffff;
    }

    .benefits-list li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--gold);
      font-weight: bold;
    }

    /* Contact & Form */
    .contact-item {
      margin-bottom: 16px;
    }

    .contact-item strong {
      display: block;
      color: var(--gold);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .contact-item a {
      color: #ffffff;
      text-decoration: none;
    }

    .contact-item a:hover {
      color: var(--gold);
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background-color: var(--navy-dark);
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
